name: Auto Update NVIDIA GPU Exporter Version

on:
  schedule:
    # Run every Monday at 6 AM UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:
    # Manual trigger option
    inputs:
      force_update:
        description: 'Force update even if no new version is available'
        required: false
        default: false
        type: boolean
  push:
    # Run when the workflow itself is modified
    branches: [main]
    paths:
      - '.github/workflows/update-version.yml'
  pull_request:
    # Run on PRs that modify the workflow
    paths:
      - '.github/workflows/update-version.yml'

permissions: {}

jobs:
  check-version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      update-needed: ${{ steps.version-check.outputs.update-needed }}
      current-version: ${{ steps.version-check.outputs.current-version }}
      latest-version: ${{ steps.version-check.outputs.latest-version }}
      download-url: ${{ steps.version-check.outputs.download-url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check for new version
        id: version-check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_UPDATE: ${{ github.event.inputs.force_update }}
        run: |
          # build-plg.sh is the single source of truth for the exporter version
          CURRENT_VERSION="v$(grep -oE '^EXPORTER_VERSION="[0-9.]+"' build-plg.sh | cut -d'"' -f2)"
          echo "Current version: $CURRENT_VERSION"
          echo "current-version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"

          LATEST_RELEASE=$(curl -s -H "Authorization: Bearer $GITHUB_TOKEN" https://api.github.com/repos/utkuozdemir/nvidia_gpu_exporter/releases/latest)
          LATEST_VERSION=$(echo "$LATEST_RELEASE" | jq -r '.tag_name')
          # The tag goes into sed expressions, a git branch name and build-plg.sh,
          # so take nothing but a plain vX.Y.Z.
          if ! [[ "$LATEST_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: upstream tag_name is not vX.Y.Z (got: $LATEST_VERSION)"
            echo "$LATEST_RELEASE"
            exit 1
          fi
          echo "Latest version: $LATEST_VERSION"
          echo "latest-version=$LATEST_VERSION" >> "$GITHUB_OUTPUT"

          DOWNLOAD_URL=$(echo "$LATEST_RELEASE" | jq -r '.assets[] | select(.name | test("^nvidia_gpu_exporter_[0-9][0-9.]*_linux_x86_64\\.tar\\.gz$")) | .browser_download_url')
          echo "Download URL: $DOWNLOAD_URL"
          echo "download-url=$DOWNLOAD_URL" >> "$GITHUB_OUTPUT"

          if [ "$CURRENT_VERSION" != "$LATEST_VERSION" ] || [ "$FORCE_UPDATE" == "true" ]; then
            echo "Update needed: true"
            echo "update-needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Update needed: false"
            echo "update-needed=false" >> "$GITHUB_OUTPUT"
          fi

  # Never on a pull request: this job pushes a branch cut from the checked-out
  # ref and merges it, which from a PR's merge commit would land the PR's own
  # changes on main unreviewed. A PR run stops after check-version.
  update-plugin:
    needs: check-version
    if: needs.check-version.outputs.update-needed == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # gh workflow run: dispatch the required validate check on the update branch
      actions: write

    steps:
      - name: Checkout repository
        # zizmor: ignore[artipacked] the Push step below pushes the update branch with this credential
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Update build-plg.sh and rebuild the plg
        env:
          LATEST_VERSION: ${{ needs.check-version.outputs.latest-version }}
        run: |
          set -euo pipefail
          LATEST_NO_V="${LATEST_VERSION#v}"
          TODAY=$(date +%Y.%m.%d)

          # Fetch the release checksum for the plain linux_x86_64 tarball
          SHA=$(curl -sL "https://github.com/utkuozdemir/nvidia_gpu_exporter/releases/download/${LATEST_VERSION}/checksums.txt" \
            | awk -v f="nvidia_gpu_exporter_${LATEST_NO_V}_linux_x86_64.tar.gz" '$2==f{print $1}')
          if ! echo "$SHA" | grep -qE '^[0-9a-f]{64}$'; then
            echo "ERROR: could not fetch a valid sha256 from checksums.txt (got: $SHA)"
            exit 1
          fi

          # Unraid compares plugin versions as strings, so a same-day release
          # needs a letter suffix to sort above the released one
          CUR_PLG_VER=$(grep -oE '^VERSION="[^"]+"' build-plg.sh | cut -d'"' -f2)
          if [[ "$CUR_PLG_VER" == "$TODAY"* ]]; then
            SUF="${CUR_PLG_VER:10}"
            if [ -z "$SUF" ]; then NEW_VER="${TODAY}a"; else NEW_VER="$TODAY$(echo "$SUF" | tr 'a-y' 'b-z')"; fi
          else
            NEW_VER="$TODAY"
          fi
          echo "Plugin version: $CUR_PLG_VER -> $NEW_VER, exporter -> $LATEST_VERSION"

          sed -i "s/^VERSION=.*/VERSION=\"$NEW_VER\"/" build-plg.sh
          sed -i "s/^EXPORTER_VERSION=.*/EXPORTER_VERSION=\"$LATEST_NO_V\"/" build-plg.sh
          sed -i "s/^EXPORTER_SHA256=.*/EXPORTER_SHA256=\"$SHA\"/" build-plg.sh

          NEW_CHANGES="###$NEW_VER\n- Updated to nvidia-gpu-exporter $LATEST_VERSION\n- Auto-updated via GitHub Actions"
          sed -i "/^<CHANGES>$/a\\$NEW_CHANGES" build-plg.sh

          ./build-plg.sh

      - name: Validate updated plugin
        env:
          DOWNLOAD_URL: ${{ needs.check-version.outputs.download-url }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libxml2-utils >/dev/null
          xmllint --noout nvidia_gpu_exporter.plg
          echo "XML validation passed"

          # build-plg.sh derives the URL the plg downloads from EXPORTER_VERSION;
          # it must be the asset the release actually publishes.
          PLG_URL=$(grep -oE '^DOWNLOAD_URL="[^"]+"' nvidia_gpu_exporter.plg | cut -d'"' -f2)
          if [ "$PLG_URL" != "$DOWNLOAD_URL" ]; then
            echo "ERROR: the plg downloads '$PLG_URL' but the release asset is '$DOWNLOAD_URL'"
            exit 1
          fi
          echo "Download URL matches the release asset"

          if curl -I -L --fail "$DOWNLOAD_URL" >/dev/null 2>&1; then
            echo "Download URL validation passed"
          else
            echo "ERROR: Download URL validation failed"
            exit 1
          fi

      - name: Push the update branch and open a pull request
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURRENT_VERSION: ${{ needs.check-version.outputs.current-version }}
          LATEST_VERSION: ${{ needs.check-version.outputs.latest-version }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          BRANCH_NAME="update-nvidia-gpu-exporter-${LATEST_VERSION}"
          git checkout -b "$BRANCH_NAME"

          git add build-plg.sh nvidia_gpu_exporter.plg
          git commit -m "chore: update nvidia-gpu-exporter from $CURRENT_VERSION to $LATEST_VERSION"

          # --force and the PR lookup let a re-run of a failed update reuse the
          # branch and the pull request the earlier attempt left behind.
          git push --force origin "$BRANCH_NAME"

          if [ -n "$(gh pr list --head "$BRANCH_NAME" --json number --jq '.[0].number // empty')" ]; then
            echo "A pull request for $BRANCH_NAME is already open"
            exit 0
          fi

          PR_BODY="Updates the bundled nvidia-gpu-exporter from $CURRENT_VERSION to $LATEST_VERSION.

          Bumps the version pins in build-plg.sh (exporter version and tarball sha256) and rebuilds nvidia_gpu_exporter.plg. The download URL was checked and the plg validated with xmllint.

          Release notes: https://github.com/utkuozdemir/nvidia_gpu_exporter/releases/tag/$LATEST_VERSION"

          gh pr create \
            --title "chore: update nvidia-gpu-exporter to $LATEST_VERSION" \
            --body "$PR_BODY" \
            --head "$BRANCH_NAME" \
            --base main

      # main requires the validate check, but a pull request opened with
      # GITHUB_TOKEN starts no workflow. workflow_dispatch is the one event this
      # token may start, so run validate-plg.yml on the branch by hand and wait.
      - name: Run the validate check on the update branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LATEST_VERSION: ${{ needs.check-version.outputs.latest-version }}
        run: |
          BRANCH_NAME="update-nvidia-gpu-exporter-${LATEST_VERSION}"
          HEAD_SHA=$(git rev-parse HEAD)
          gh workflow run validate-plg.yml --ref "$BRANCH_NAME"

          # The dispatched run takes a few seconds to show up. Match it by the
          # pushed commit so a run from an earlier attempt is never picked.
          RUN_ID=""
          for _ in $(seq 1 24); do
            sleep 5
            RUN_ID=$(gh run list --workflow validate-plg.yml --branch "$BRANCH_NAME" --event workflow_dispatch \
              --json databaseId,headSha --jq "map(select(.headSha == \"$HEAD_SHA\")) | .[0].databaseId // empty")
            [ -n "$RUN_ID" ] && break
          done
          if [ -z "$RUN_ID" ]; then
            echo "ERROR: no validate-plg.yml run for $HEAD_SHA appeared within 2 minutes"
            exit 1
          fi

          echo "Watching validate-plg.yml run $RUN_ID"
          gh run watch "$RUN_ID" --exit-status

      - name: Merge pull request and delete branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LATEST_VERSION: ${{ needs.check-version.outputs.latest-version }}
        run: |
          BRANCH_NAME="update-nvidia-gpu-exporter-${LATEST_VERSION}"
          PR_NUMBER=$(gh pr list --head "$BRANCH_NAME" --json number --jq '.[0].number // empty')

          if [ -n "$PR_NUMBER" ]; then
            # The required validate check passed in the step above, so merge
            # now rather than with --auto.
            gh pr merge "$PR_NUMBER" --squash --delete-branch
            echo "Merged PR #$PR_NUMBER and deleted branch"
          else
            echo "ERROR: Could not find PR to merge"
            exit 1
          fi

  notify:
    needs: [check-version, update-plugin]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Notify workflow result
        env:
          CURRENT_VERSION: ${{ needs.check-version.outputs.current-version }}
          LATEST_VERSION: ${{ needs.check-version.outputs.latest-version }}
          UPDATE_NEEDED: ${{ needs.check-version.outputs.update-needed }}
          UPDATE_RESULT: ${{ needs.update-plugin.result }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$UPDATE_NEEDED" == "true" ] && [ "$EVENT" == "pull_request" ]; then
            echo "Update from $CURRENT_VERSION to $LATEST_VERSION available; not applied from a pull request."
          elif [ "$UPDATE_NEEDED" == "true" ]; then
            if [ "$UPDATE_RESULT" == "success" ]; then
              echo "Updated from $CURRENT_VERSION to $LATEST_VERSION"
            else
              echo "Failed to update from $CURRENT_VERSION to $LATEST_VERSION"
              exit 1
            fi
          else
            echo "No update needed. Current version $CURRENT_VERSION is up to date."
          fi
